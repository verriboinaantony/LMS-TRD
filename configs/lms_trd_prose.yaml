# LMS-TRD "paper-as-written" configuration (literal Section 3.2 prose).
#
# This uses the FLAT shared SST backbone (no internal downsampling). Built
# strictly to the prose (channels 32/64/128, depth [2,2,2]) it measures well
# under 1 M parameters and ~25 G FLOPs -- the correct implementation of the
# METHOD AS WRITTEN, but it does NOT reproduce the reported 7.87 M / 64.22 G.
# Kept for comparison; use configs/lms_trd.yaml to match the reported numbers.

model:
  backbone: flat
  native_dims: [32, 64, 128]
  shared_dim: 64
  depth: 2
  num_heads: 4
  expansion: 4
  low_rank_ratio: 2
  inr_table_log2: 14
  share_weights: true
  use_inr: true
  use_ebfu: true
  use_rrb: true

train:
  epochs: 200
  batch_size: 16
  patch_size: 256
  lr: 2.0e-4
  lr_step: 50
  lr_gamma: 0.5
  num_workers: 4
  seed: 42
  ckpt_dir: checkpoints
  log_interval: 50

loss:
  lambda_edge: 0.05
  lambda_freq: 0.01
  lambda_inr: 0.1
  char_eps: 1.0e-3

data:
  train_root: data/train
  val_root: data/val
  rainy_dir: rainy
  clean_dir: clean
